services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pedelocal}
      POSTGRES_USER: ${POSTGRES_USER:-pedelocal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pedelocal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/PedeLocal.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: ${CONNECTIONSTRINGS__DEFAULT}
      Jwt__Secret: ${JWT__SECRET:?JWT__SECRET is required}
      Jwt__Issuer: ${JWT__ISSUER:-PedeLocal}
      Jwt__Audience: ${JWT__AUDIENCE:-PedeLocal.Client}
      Firebase__Enabled: ${FIREBASE__ENABLED:-false}
      Firebase__CredentialsJson: ${FIREBASE__CREDENTIALSJSON:-}
      Cors__AllowedOrigins__0: ${CORS__ALLOWEDORIGINS__0:-}
      Cors__AllowedOrigins__1: ${CORS__ALLOWEDORIGINS__1:-}
    ports:
      - "8080:8080"

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pedelocal.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"

volumes:
  postgres_data:
