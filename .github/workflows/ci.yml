name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pedelocal_ci
          POSTGRES_USER: pedelocal
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pedelocal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PedeLocal.slnx

      - name: Build
        run: dotnet build PedeLocal.slnx --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test tests/PedeLocal.UnitTests --no-build --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./test-results

      - name: Apply EF Core migrations against CI database
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=pedelocal_ci;Username=pedelocal;Password=ci-only-password"
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          dotnet ef database update \
            --project src/PedeLocal.Infrastructure/PedeLocal.Infrastructure.csproj \
            --startup-project src/PedeLocal.Api/PedeLocal.Api.csproj

      - name: Integration tests
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=pedelocal_ci;Username=pedelocal;Password=ci-only-password"
        run: >
          dotnet test tests/PedeLocal.IntegrationTests --no-build --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pedelocal_e2e
          POSTGRES_USER: pedelocal
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pedelocal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=pedelocal_e2e;Username=pedelocal;Password=ci-only-password"
      Jwt__Secret: "ci-e2e-secret-key-must-be-at-least-32-chars"
      Jwt__Issuer: PedeLocal
      Jwt__Audience: PedeLocal.Client
      RateLimiting__AuthPermitLimit: "1000"
      RateLimiting__GlobalPermitLimit: "10000"
      PEDELOCAL_API_URL: http://127.0.0.1:8080
      PEDELOCAL_ADMIN_EMAIL: admin@pedelocal.dev
      PEDELOCAL_ADMIN_PASSWORD: Senha123!
      PEDELOCAL_TEST_PASSWORD: Senha123!
      PEDELOCAL_E2E_REALTIME: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Restore and build API
        run: |
          dotnet restore PedeLocal.slnx
          dotnet build src/PedeLocal.Api/PedeLocal.Api.csproj --no-restore --configuration Release

      - name: Start API
        run: |
          nohup dotnet run --project src/PedeLocal.Api/PedeLocal.Api.csproj --no-build --configuration Release --urls http://127.0.0.1:8080 > api-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/cities >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          cat api-e2e.log
          exit 1

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E API suite
        working-directory: tests/e2e
        run: npx playwright test --project=api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            api-e2e.log
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/PedeLocal.Api/Dockerfile -t pedelocal-api:ci .
